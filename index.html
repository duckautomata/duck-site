<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>%VITE_PAGE_TITLE%</title>
        <meta name="title" content="%VITE_PAGE_TITLE%" />
        <meta name="description" content="A central hub for all Dragoon websites made by Duck Automata." />
        <meta name="theme-color" content="#1E6654" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://%VITE_SUB_DOMAIN%.duck-automata.com/" />
        <meta property="og:title" content="%VITE_PAGE_TITLE%" />
        <meta property="og:description" content="A central hub for all Dragoon websites made by Duck Automata." />
        <meta property="og:image" content="https://%VITE_SUB_DOMAIN%.duck-automata.com/site_preview.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:creator" content="@duckautomata" />
        <meta name="twitter:url" content="https://%VITE_SUB_DOMAIN%.duck-automata.com/" />
        <meta name="twitter:title" content="%VITE_PAGE_TITLE%" />
        <meta name="twitter:description" content="A central hub for all Dragoon websites made by Duck Automata." />
        <meta name="twitter:image" content="https://%VITE_SUB_DOMAIN%.duck-automata.com/site_preview.png" />

        <!-- Used to preload theme before browser renders page -->
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem("theme");
                    if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                        document.documentElement.setAttribute("data-theme", "dark");
                    }
                } catch (e) {}
            })();
        </script>
        <style>
            body {
                background-color: #f0f2f5;
            }
            html[data-theme="dark"] body {
                background-color: #1a202c;
            }
        </style>
    </head>

    <body>
        <header class="hero">
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="theme-toggle" title="Toggle theme">
                    <input type="checkbox" id="theme-toggle" />
                    <span class="slider"></span>
                </label>
            </div>

            <h1>Duck Automata Websites</h1>
            <p class="hub-description">A central hub for all the websites I made for my fellow Dragoons.</p>
        </header>

        <div class="toolbar">
            <div class="toolbar-inner">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="16.5" y1="16.5" x2="21" y2="21" />
                    </svg>
                    <input
                        type="search"
                        id="site-search"
                        class="search-input"
                        placeholder="Search sites…"
                        aria-label="Search sites"
                        autocomplete="off"
                    />
                    <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>
                        &times;
                    </button>
                    <kbd class="search-hint" title="Press / to jump to search">/</kbd>
                </div>

                <div class="toolbar-row">
                    <div id="tag-filters" class="tag-filters" role="group" aria-label="Filter sites"></div>
                    <span id="result-count" class="result-count"></span>
                </div>
            </div>
        </div>

        <main id="site-grid"></main>

        <div id="lightbox-modal" class="lightbox">
            <span class="lightbox-close" role="button" aria-label="Close">&times;</span>
            <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous example" hidden>
                &#8249;
            </button>
            <img class="lightbox-content" id="lightbox-img" alt="Example screenshot" />
            <button type="button" class="lightbox-nav lightbox-next" aria-label="Next example" hidden>&#8250;</button>
            <span id="lightbox-counter" class="lightbox-counter" hidden></span>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
